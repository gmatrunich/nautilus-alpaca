[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "nautilus-alpaca"
version = "0.1.0"
description = "Alpaca broker adapter for NautilusTrader (US equities, crypto, options, paper trading)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "nautilus-alpaca contributors" },
]
keywords = [
    "alpaca",
    "nautilus",
    "nautilustrader",
    "trading",
    "algorithmic-trading",
    "equities",
    "crypto",
    "options",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "nautilus_trader>=1.226.0",
    "alpaca-py>=0.43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/your-org/nautilus-alpaca"
Issues = "https://github.com/your-org/nautilus-alpaca/issues"

[tool.hatch.build.targets.wheel]
packages = ["nautilus_alpaca"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
